version: '3'

set: [pipefail]

vars:
  TASK_EXECUTION:
    sh: >-
      case "${TASK_DRY-}" in
      ''|0|[Ff][Aa][Ll][Ss][Ee]) ;;
      *) printf '%s\n' 'error: unset TASK_DRY before executing verification tasks' >&2; exit 1 ;;
      esac
  CARGO:
    sh: 'printf "%s" "${CARGO-cargo}"'
  PYTHON:
    sh: 'printf "%s" "${PYTHON-python3}"'
  # An empty prefix must remain an empty executable, not expose the following command.
  CARGO_COMMAND: >-
    {{.CARGO | default "''"}}
  PYTHON_COMMAND: >-
    {{.PYTHON | default "''"}}
  # Declare CLI overrides before RUN; null leaves the inherited environment unchanged.
  PQ_LIB_DIR: null
  CC: null
  CFLAGS: null
  CPPFLAGS: null
  LDFLAGS: null
  PKG_CONFIG_PATH: null
  PG_BINDIR: null
  PG_CONFIG: null
  CARGO_TARGET_DIR: null
  RPGMIGRATE_BIN: null
  RPGMIGRATE_E2E_REPORT_PROBE: null
  CONTAINER_RUNTIME: null
  PROFILE: null
  CLONE_PROFILE:
    sh: |-
      profile={{if ne .PROFILE nil}}{{.PROFILE | shellQuote}}{{else}}"${PROFILE-disabled}"{{end}}
      case "$profile" in
        disabled|m8) printf '%s' "$profile" ;;
        *) printf '%s\n' 'error: PROFILE must be disabled or m8' >&2; exit 1 ;;
      esac
  IMAGE: null
  IMAGE_REVISION: null
  IMAGE_REVISION_VALUE:
    sh: 'printf "%s" "${IMAGE_REVISION-}"'
  IMAGE_REVISION_ARGUMENT: >-
    {{if ne .IMAGE_REVISION nil}}{{.IMAGE_REVISION | shellQuote}}{{else}}{{.IMAGE_REVISION_VALUE | shellQuote}}{{end}}
  CONTAINER_VALUE:
    sh: 'printf "%s" "${CONTAINER_RUNTIME-podman}"'
  IMAGE_VALUE:
    sh: 'printf "%s" "${IMAGE-localhost/rpgmigrate:dev}"'
  CONTAINER_ARGUMENT: >-
    {{if ne .CONTAINER_RUNTIME nil}}{{.CONTAINER_RUNTIME | shellQuote}}{{else}}{{.CONTAINER_VALUE | shellQuote}}{{end}}
  IMAGE_ARGUMENT: >-
    {{if ne .IMAGE nil}}{{.IMAGE | shellQuote}}{{else}}{{.IMAGE_VALUE | shellQuote}}{{end}}
  RPGMIGRATE_TEST_EXPECTED_PG_VERSION: null
  RPGMIGRATE_TEST_EXPECTED_PG_VERSION_NUM: null
  # Inline exports preserve CLI precedence even when the inherited environment differs.
  RUN: >-
    {{.TASK_EXECUTION}}
    {{range $name := list "PQ_LIB_DIR" "CC" "CFLAGS" "CPPFLAGS" "LDFLAGS" "PKG_CONFIG_PATH" "PG_BINDIR" "PG_CONFIG"
    "CARGO_TARGET_DIR" "RPGMIGRATE_BIN" "CONTAINER_RUNTIME" "RPGMIGRATE_E2E_REPORT_PROBE"
    "RPGMIGRATE_TEST_EXPECTED_PG_VERSION" "RPGMIGRATE_TEST_EXPECTED_PG_VERSION_NUM"}}
    {{if ne (index $ $name) nil}}export {{$name}}={{index $ $name | shellQuote}};{{end}}
    {{end}}
    if [ "${PQ_LIB_DIR+x}" = x ]; then : "${PQ_LIB_DIR:?PQ_LIB_DIR must not be empty}"; fi;
  UNIT_FILTERS: >-
    --skip pg::live_tests:: --skip pg::prepared_live_tests:: --skip pg::replication_live_tests::
    --skip apply::checkpoint::live_tests:: --skip catalog::tests::live_ --skip copy::tests::live_
    --skip catalog::clone::tests::live_identity_ --skip catalog::follow::tests::live_identity_
    --skip snapshot::follow_tests::live_ --skip snapshot::follow_fault_tests::live_ --skip cdc::receive::tests::live_
    --skip pg::follow_receive_tests::live_ --skip apply::plan::tests::live_

tasks:
  default:
    desc: Check all Rust targets
    cmds:
      - task: check

  help:
    desc: List available tasks
    cmds:
      - '{{.TASK_EXE | shellQuote}} --list-all'

  check:
    desc: Check all Rust targets
    cmds:
      - '{{.RUN}} {{.CARGO_COMMAND}} check --locked --all-targets'

  fmt-check:
    desc: Check Rust formatting
    cmds:
      - '{{.RUN}} {{.CARGO_COMMAND}} fmt --all -- --check'

  lint:
    desc: Check formatting and run strict Clippy
    cmds:
      - task: fmt-check
      - '{{.RUN}} {{.CARGO_COMMAND}} clippy --locked --all-targets -- -D warnings'

  build:
    desc: Build the executable
    cmds:
      - '{{.RUN}} {{.CARGO_COMMAND}} build --locked'

  test:
    desc: Run local test suites in order
    cmds:
      - task: test-unit
      - task: test-cli
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/ci/unit.py'

  test-unit:
    desc: Run nonempty Rust unit tests without live databases
    cmds:
      - >-
        {{.RUN}} {{.CARGO_COMMAND}} test --locked --lib -- --list {{.UNIT_FILTERS}} |
        awk '/: test$/ { count++ } END { if (count == 0) { print "error: no Rust unit tests discovered"; exit 1 } }'
      - '{{.RUN}} {{.CARGO_COMMAND}} test --locked --lib --bins -- {{.UNIT_FILTERS}}'

  test-cli:
    desc: Verify CLI compatibility
    cmds:
      - task: build
      - '{{.RUN}} {{.PYTHON_COMMAND}} tests/cli_contract.py'

  test-harness:
    desc: Test the database harness
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/ci/unit.py --harness'

  test-db:
    desc: Run retained database and exact pgoutput follow profiles
    cmds:
      - task: build
      - task: test-engine
      - task: test-catalog
      - task: test-source-catalog
      - task: test-clone
      - task: test-schema
      - task: test-follow-source
      - task: test-follow-snapshot
      - task: test-follow-authority
      - task: test-follow-receive
      - task: test-follow-apply
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py -- {{.CARGO_COMMAND}}
        test --locked --test copy_integration -- --test-threads=1

  test-engine:
    desc: Run the exact engine profile
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --engine -- {{.CARGO_COMMAND}}
        test --locked --lib -- --ignored --test-threads=1
        --skip catalog::tests::live_cdc_ --skip catalog::tests::live_clone_admission_
        --skip catalog::tests::live_source_identity_
        --skip catalog::clone::tests::live_identity_ --skip catalog::follow::tests::live_identity_
        --skip catalog::follow::tests::live_cleanup_
        --skip catalog::tests::live_money_clone_preserves_values_and_defaults_across_role_locales
        --skip snapshot::follow_tests::live_ --skip snapshot::follow_fault_tests::live_
        --skip cdc::receive::tests::live_ --skip pg::follow_receive_tests::live_
        --skip apply::plan::tests::live_ --skip apply::checkpoint::live_tests::follow_
        --skip cdc::receive::tests::full_fifo_status_survives_walsender_timeout
        --skip snapshot::clone_tests:: --skip copy::live_tests::
        --skip apply::checkpoint::clone_marker_tests:: --skip schema::tests::live_

  test-catalog:
    desc: Run the live CDC catalog profile
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --catalog -- {{.CARGO_COMMAND}}
        test --locked --lib catalog::tests::live_ -- --ignored --test-threads=1
        --skip catalog::tests::live_source_identity_ --skip catalog::tests::live_preflight_

  test-clone:
    desc: Run the ten exact isolated native clone component cases
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --clone -- {{.CARGO_COMMAND}}
        test --locked --lib -- --ignored --test-threads=1
        snapshot::clone_tests:: copy::live_tests:: apply::checkpoint::clone_marker_tests::

  test-follow-authority:
    desc: Run the exact pgoutput authority and owned restart profile
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --follow-authority -- {{.CARGO_COMMAND}}
        test --locked --lib apply::checkpoint::live_tests::follow_ -- --ignored --test-threads=1

  test-follow-receive:
    desc: Run the exact pgoutput receiver configuration and startup profile
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --follow-receive -- {{.CARGO_COMMAND}}
        test --locked --lib -- --include-ignored --exact --test-threads=1
        cdc::receive::tests::live_configuration_and_logical_query_preserve_export_lifetime
        pg::follow_receive_tests::live_pipeline_commands_counts_dispatched_commands
        cdc::receive::tests::live_startup_refuses_slot_advanced_beyond_recovery_before_readiness
        cdc::receive::tests::full_fifo_status_survives_walsender_timeout
        cdc::receive::tests::drain_request_retries_and_coalesces_without_advancing_feedback
        cdc::receive::tests::idle_drain_request_wakes_before_the_status_timer_without_advancing_feedback
        cdc::receive::tests::completed_stop_requires_checked_terminal_results
        cdc::receive::tests::completed_stop_during_partial_later_input_checks_end_without_decoding_the_tail
        cdc::receive::tests::completed_stop_drains_pending_status_before_ending_and_keeps_reply_intent
        cdc::receive::tests::completed_stop_while_fifo_full_preserves_order_and_unapplied_feedback_floor
        cdc::receive::tests::completed_stop_waiting_for_terminals_preserves_deadline_and_cancellation

  test-follow-apply:
    desc: Run the exact pgoutput row semantics and differential profile
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --follow-apply -- {{.CARGO_COMMAND}}
        test --locked --lib -- --ignored --test-threads=1
        apply::plan::tests::live_ catalog::clone::tests::live_identity_ catalog::follow::tests::live_identity_

  test-follow-snapshot:
    desc: Run nine exact pgoutput snapshot cases and five observed fault receipts
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --follow-snapshot -- {{.CARGO_COMMAND}}
        test --locked --lib snapshot::follow_fault_tests::live_follow_ -- --ignored --test-threads=1

  test-follow-source:
    desc: Run twelve exact pgoutput source snapshot and owned cleanup cases
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --follow-source -- {{.CARGO_COMMAND}}
        test --locked --lib -- --ignored --test-threads=1
        snapshot::follow_tests::live_follow_ catalog::follow::tests::live_cleanup_

  test-schema:
    desc: Run three exact isolated schema utility and restart guard cases
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --schema -- {{.CARGO_COMMAND}}
        test --locked --lib -- --ignored --test-threads=1 schema::tests::live_

  test-source-catalog:
    desc: Run the live source identity probe profile
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --source-catalog -- {{.CARGO_COMMAND}}
        test --locked --lib catalog::tests::live_source_identity_ -- --ignored --test-threads=1

  test-transport:
    desc: Run the live transport profile
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --transport -- {{.CARGO_COMMAND}}
        test --locked --lib pg::live_tests:: -- --ignored --test-threads=1

  test-prepared:
    desc: Run the prepared execution profile
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --prepared -- {{.CARGO_COMMAND}}
        test --locked --lib pg:: -- --ignored --test-threads=1
        --skip pg::live_tests:: --skip pg::replication_live_tests:: --skip pg::follow_receive_tests::live_

  test-replication:
    desc: Run the replication profile
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --replication -- {{.CARGO_COMMAND}}
        test --locked --lib pg::replication_live_tests:: -- --ignored --test-threads=1

  test-authority:
    desc: Run the authority profile
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --authority -- {{.CARGO_COMMAND}}
        test --locked --lib apply::checkpoint::live_tests:: -- --ignored --test-threads=1
        --skip apply::checkpoint::live_tests::follow_

  test-db-self-check:
    desc: Run database harness negative controls
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/test-db.py --self-check'

  test-e2e-clone-unit:
    desc: Check disposable clone harness controls without containers
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} -W error tools/e2e/test_clone.py'
      - '{{.RUN}} {{.PYTHON_COMMAND}} -W error tools/e2e/test_copy_features.py'

  test-e2e-clone-16-16:
    desc: Run the selected clone workflow profile on PostgreSQL 16 to 16
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/e2e/clone.py --pair 16-16 --profile {{.CLONE_PROFILE | shellQuote}}'

  test-e2e-clone-18-18:
    desc: Run the selected clone workflow profile on PostgreSQL 18 to 18
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/e2e/clone.py --pair 18-18 --profile {{.CLONE_PROFILE | shellQuote}}'

  test-e2e-clone-16-18:
    desc: Run the selected clone workflow profile on PostgreSQL 16 to 18
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/e2e/clone.py --pair 16-18 --profile {{.CLONE_PROFILE | shellQuote}}'

  test-e2e-clone:
    desc: Run the selected clone workflow profile on all three version pairs
    cmds:
      - task: test-e2e-clone-16-16
      - task: test-e2e-clone-18-18
      - task: test-e2e-clone-16-18

  test-e2e-follow-smoke-16-16:
    desc: Check initial copy and ongoing DML on PostgreSQL 16 to 16
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/e2e/follow.py --smoke --pair 16-16'

  test-e2e-follow-smoke-18-18:
    desc: Check initial copy and ongoing DML on PostgreSQL 18 to 18
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/e2e/follow.py --smoke --pair 18-18'

  test-e2e-follow-smoke-16-18:
    desc: Check initial copy and ongoing DML on PostgreSQL 16 to 18
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/e2e/follow.py --smoke --pair 16-18'

  test-e2e-follow-unit:
    desc: Check disposable follow harness controls without containers
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} -W error tools/e2e/test_follow.py'
      - '{{.RUN}} {{.PYTHON_COMMAND}} -W error tools/e2e/test_follow_wire_protocol.py'
      - '{{.RUN}} {{.PYTHON_COMMAND}} -W error tools/e2e/test_cutover.py'

  test-e2e-follow-16-16:
    desc: Qualify ongoing follow and recovery boundaries on PostgreSQL 16 to 16
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/e2e/follow.py --pair 16-16'

  test-e2e-follow-18-18:
    desc: Qualify ongoing follow and recovery boundaries on PostgreSQL 18 to 18
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/e2e/follow.py --pair 18-18'

  test-e2e-follow-16-18:
    desc: Qualify ongoing follow and recovery boundaries on PostgreSQL 16 to 18
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/e2e/follow.py --pair 16-18'

  test-e2e-follow:
    desc: Qualify all three declared ongoing follow version pairs
    cmds:
      - task: test-e2e-follow-16-16
      - task: test-e2e-follow-18-18
      - task: test-e2e-follow-16-18

  test-e2e-cutover-16-16:
    desc: Check M4 engine producer cases on PostgreSQL 16-16; independent M6/Go evidence remains required
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/e2e/follow.py --cutover --pair 16-16'

  test-e2e-cutover-18-18:
    desc: Check M4 engine producer cases on PostgreSQL 18-18; independent M6/Go evidence remains required
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/e2e/follow.py --cutover --pair 18-18'

  test-e2e-cutover-16-18:
    desc: Check M4 engine producer cases on PostgreSQL 16-18; independent M6/Go evidence remains required
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/e2e/follow.py --cutover --pair 16-18'

  test-e2e-cutover:
    desc: Check all three M4 engine producer pairs without claiming M6/Go qualification
    cmds:
      - task: test-e2e-cutover-16-16
      - task: test-e2e-cutover-18-18
      - task: test-e2e-cutover-16-18

  image:build:
    desc: Build the local native runner image
    cmds:
      - |-
        {{.RUN}}
        revision={{.IMAGE_REVISION_ARGUMENT}}
        if [ -n "$revision" ]; then
          case "$revision" in
            *[!0-9a-f]*) printf '%s\n' 'IMAGE_REVISION must be a full lowercase Git commit' >&2; exit 1 ;;
          esac
          test "${#revision}" -eq 40 || {
            printf '%s\n' 'IMAGE_REVISION must be a full lowercase Git commit' >&2; exit 1;
          }
          {{.CONTAINER_ARGUMENT}} build --tag {{.IMAGE_ARGUMENT}} \
            --build-arg "SOURCE_REVISION=$revision" --file Dockerfile .
        else
          {{.CONTAINER_ARGUMENT}} build --tag {{.IMAGE_ARGUMENT}} --file Dockerfile .
        fi

  image:smoke:
    desc: Check the local runner and emit a JSON packaging receipt
    cmds:
      - '{{.RUN}} {{.PYTHON_COMMAND}} tools/image/smoke.py --image {{.IMAGE_ARGUMENT}}'

  image:dev:publish:
    desc: Publish a source-bound development image from the approved GitHub Actions workflow
    requires: {vars: [ARCHITECTURE, IMAGE_REVISION, OUTPUT_DIR]}
    vars:
      PUBLICATION_REVISION: >-
        {{if not (regexMatch "^[0-9a-f]{40}$" (.IMAGE_REVISION | default ""))}}
        {{fail "IMAGE_REVISION must be a full lowercase Git commit"}}{{end}}{{.IMAGE_REVISION}}
    cmds:
      - >-
        {{.RUN}} {{.PYTHON_COMMAND}} tools/image/dev_publish.py publish
        --architecture {{.ARCHITECTURE | shellQuote}} --expected-commit {{.PUBLICATION_REVISION | trim | shellQuote}}
        --output-dir {{.OUTPUT_DIR | shellQuote}}
        {{if .RETAINED_RECEIPT}}--retained-receipt {{.RETAINED_RECEIPT | shellQuote}}{{end}}
