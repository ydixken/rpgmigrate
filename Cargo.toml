[package]
name = "rpgmigrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
description = "PostgreSQL migration engine with explicit ownership and durable completion"

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
libc = "=0.2.191"
pq-sys = { version = "=0.7.8", default-features = false, features = ["pkg-config"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
crc32fast = "=1.5.4"

[[test]]
name = "storage_format"
path = "tests/storage_format.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
