name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install stock PGDG libpq 18 and pkg-config
        run: |
          pgdg_key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          pgdg_repository=https://apt.postgresql.org/pub/repos/apt
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --location --proto '=https' --tlsv1.2 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o "$pgdg_key"
          . /etc/os-release
          printf '%s\n' "deb [signed-by=$pgdg_key] $pgdg_repository ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends 'libpq-dev=18.*' 'libpq5=18.*' pkg-config
          dpkg-query -W libpq-dev libpq5
          pkg-config --modversion libpq
      - name: Select the manifest's Rust toolchain
        run: |
          toolchain=$(python3 -c \
            'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          rustup override set "$toolchain"
          rustc --version
          cargo --version
      - name: Install and verify Task from the shared checksum pin
        run: |
          task_bin=$(python3 tools/bootstrap-task.py)
          dirname "$task_bin" >> "$GITHUB_PATH"
      - name: Check, lint and test
        run: task --silent --output=interleaved --color=false check lint test

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Select the manifest's Rust toolchain
        run: |
          toolchain=$(python3 -c \
            'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$toolchain" --profile minimal
          rustup override set "$toolchain"
          rustc --version
          cargo --version
      - name: Install the pinned dependency auditor
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --version
      - name: Restrict the private license exemption to the unpublished root
        run: |
          mkdir -p target
          cargo metadata --locked --format-version 1 > target/dependency-metadata.json
          python3 - <<'PYDEPENDENCIES'
          import json
          from pathlib import Path
          metadata = json.loads(Path("target/dependency-metadata.json").read_text())
          root = metadata["resolve"]["root"]
          private = [package["id"] for package in metadata["packages"] if package.get("publish") == []]
          if not root or private != [root]:
              raise SystemExit("only the unpublished root may use the private license exemption")
          PYDEPENDENCIES
      - name: Audit locked licenses and advisories for both image targets
        run: cargo deny --locked check licenses advisories

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Select tracked Markdown
        id: markdown
        run: |
          python3 - <<'PYDOCS'
          import os
          import subprocess
          from pathlib import Path
          names = subprocess.check_output(["git", "ls-files", "-z", "--", "*.md", "*.markdown"])
          paths = [name.decode() for name in names.split(b"\0") if name]
          if not paths or any("\n" in path for path in paths):
              raise SystemExit("tracked Markdown inventory is empty or invalid")
          for path in paths:
              if chr(0x2014) in Path(path).read_text():
                  raise SystemExit(f"{path}: use a colon, comma, parentheses or full stop instead of an em dash")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("files<<MARKDOWN_FILES\n" + "\n".join(paths) + "\nMARKDOWN_FILES\n")
          PYDOCS
      - name: Lint tracked Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25.0.0
        with:
          globs: ${{ steps.markdown.outputs.files }}

  engine-e2e:
    # Podman 5 is the harness baseline; ubuntu-24.04 ships Podman 4.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pair: [16-16, 18-18, 16-18]
    env:
      CONTAINER_RUNTIME: podman
      # The 4-CPU hosted runner cannot hold the local 2+2+2 caps; see docs/testing.md.
      RPGMIGRATE_E2E_CAPACITY: hosted-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install and verify Task from the shared checksum pin
        run: |
          task_bin=$(python3 tools/bootstrap-task.py)
          dirname "$task_bin" >> "$GITHUB_PATH"
      - name: Check the native Podman runtime
        run: |
          command -v podman
          podman --version
          podman info
          python3 --version
          task --version
          podman_major=$(podman version --format '{{.Client.Version}}' | cut -d. -f1)
          test "$podman_major" -ge 5
      - name: Let rootless Podman stop its pasta network helper
        run: |
          # Ubuntu's pasta AppArmor profile denies podman's SIGTERM at netns teardown (Launchpad #2154379).
          # The profile has no local include, so the ephemeral runner logs instead of enforcing it.
          profile=$(grep -d skip -lE '^profile pasta[ ]' /etc/apparmor.d/*)
          echo "$profile"
          test -n "$profile"
          sudo apparmor_parser --replace --complain "$profile"
      - name: Provision the pinned public images
        run: |
          python3 - <<'PYPULL'
          import json
          import re
          import subprocess
          from pathlib import Path
          base = re.search(r"^FROM (\S+)$", Path("tools/e2e/Containerfile").read_text(), re.MULTILINE)[1]
          images = json.loads(Path("tests/fixtures/clone/cases.json").read_text())["images"]
          majors = sorted(set("${{ matrix.pair }}".split("-")))
          for reference in [base, *("docker.io/library/postgres:" + major + "@" + images[major] for major in majors)]:
              subprocess.run(["podman", "pull", "--quiet", reference], check=True)
              subprocess.run(["podman", "image", "exists", reference], check=True)
          PYPULL
      - name: Qualify the development engine image
        run: task test-e2e-clone-${{ matrix.pair }}
      - name: Summarize runtime cleanup on failure
        if: failure()
        run: |
          python3 - <<'PYLEDGER'
          import json
          from pathlib import Path
          # Statuses, resource deltas, callsites and podman error lines only; ledgers and other stderr stay on the runner.
          for path in sorted(Path("target/e2e").glob("*.runtime.json")):
              ledger = json.loads(path.read_text())
              print(json.dumps({"stage": ledger.get("stage"), "cleanup_complete": ledger.get("cleanup_complete"),
                                "private_removed": ledger.get("private_removed"),
                                **{key: value for key, value in ledger.items() if key.endswith(("_error_kind", "_verified"))},
                                "containers": [[entry.get("role"), entry.get("cleanup_status"), entry.get("cleanup_error_kind")]
                                               for entry in ledger.get("containers", [])],
                                "network": [(ledger.get("network") or {}).get(key) for key in ("cleanup_status", "cleanup_error_kind")]},
                               sort_keys=True))
              before, after = ledger.get("baseline") or {}, ledger.get("after") or {}
              for kind in sorted(set(before) | set(after)):
                  old, new = before.get(kind), after.get(kind)
                  if old != new and isinstance(old, dict) and isinstance(new, dict):
                      changed = {key: sorted(field for field in set(old[key]) | set(new[key]) if old[key].get(field) != new[key].get(field))
                                 if isinstance(old[key], dict) and isinstance(new[key], dict) else "value"
                                 for key in set(old) & set(new) if old[key] != new[key]}
                      print(kind, {"added": sorted(set(new) - set(old)), "removed": sorted(set(old) - set(new)), "changed": changed})
                  elif old != new:
                      print(kind, {"added": sorted(set(new or []) - set(old or [])), "removed": sorted(set(old or []) - set(new or []))})
          for path in sorted(Path("target/e2e/failures").glob("*.json")):
              print(path.read_text())
              if json.loads(path.read_text())["callsite"]["function"] == "raw":
                  print([line[:300] for line in path.with_suffix(".stderr").read_text(errors="replace").splitlines() if line.lstrip().startswith(("Error:", "* "))])
          PYLEDGER
          podman image ls --all --no-trunc --format '{{.ID}} {{.Repository}}:{{.Tag}} {{.CreatedAt}} {{index .Labels "io.rpgmigrate.e2e"}}'
          sudo dmesg | grep -E 'apparmor="(DENIED|ALLOWED)"' | tail -n 20 || true
      - name: Revalidate the exact sanitized clone receipt
        run: |
          test -s "target/e2e/${{ matrix.pair }}.json"
          python3 - <<'PYRECEIPT'
          import importlib.util
          import json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("clone", "tools/e2e/clone.py")
          clone = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(clone)
          report = json.loads(Path("target/e2e/${{ matrix.pair }}.json").read_text())
          if report.get("pair") != "${{ matrix.pair }}":
              raise SystemExit("clone receipt does not match the selected pair")
          clone.validate_receipt(report, clone.load_manifest())
          if not report.get("runner_image_id") or len(report.get("server_image_ids", [])) != 2:
              raise SystemExit("clone receipt lacks immutable image identities")
          PYRECEIPT
      - name: Retain sanitized clone qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: clone-${{ matrix.pair }}
          path: target/e2e/${{ matrix.pair }}.json
          if-no-files-found: error

  runner-image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CONTAINER_RUNTIME: podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install and verify Task from the shared checksum pin
        run: |
          task_bin=$(python3 tools/bootstrap-task.py)
          dirname "$task_bin" >> "$GITHUB_PATH"
      - name: Check the native Podman runtime
        run: |
          command -v podman
          podman --version
          podman info
          python3 --version
          task --version
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
      - name: Build the production runner on its native architecture
        run: task image:build
      - name: Smoke the read-only production runner as uid 65532
        run: |
          mkdir -p target/image
          task --silent image:smoke > target/image/smoke.json
          test -s target/image/smoke.json
      - name: Retain immutable image smoke qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: runner-image-${{ matrix.arch }}
          path: target/image/smoke.json
          if-no-files-found: error
